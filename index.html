<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos</title>
    <link rel="manifest" href="manifest.json" />
    <script src="vendor/tailwind.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>

  <body
    class="bg-gray-50 p-4 max-w-md mx-auto"
    x-data="pedidosApp"
    x-init="init()"
  >
    <h1 class="text-xl font-bold mb-4">Novo Pedido</h1>

    <label class="block mb-2">Telefone</label>
    <input
      type="tel"
      class="border p-2 w-full mb-1"
      x-model="phone"
      @blur="lookupCustomer()"
    />
    <p
      class="text-sm text-gray-600 mb-3"
      x-text="address ? 'Endereço: ' + address : 'Cliente novo — informe o endereço abaixo'"
    ></p>
    <template x-if="!address">
      <input
        type="text"
        placeholder="Endereço"
        class="border p-2 w-full mb-3"
        x-model="newAddress"
      />
    </template>

    <label class="block mb-2">Produto</label>
    <select class="border p-2 w-full mb-3" x-model="selectedProductId">
      <template x-for="p in products" :key="p.id">
        <option
          :value="p.id"
          x-text="p.name + ' ' + p.brand + ' - R$ ' + p.price.toFixed(2)"
        ></option>
      </template>
    </select>

    <label class="block mb-2">Quantidade</label>
    <input
      type="number"
      min="1"
      class="border p-2 w-full mb-3"
      x-model.number="qty"
    />

    <label class="block mb-2">Pagamento</label>
    <select class="border p-2 w-full mb-3" x-model="paymentMethod">
      <option value="dinheiro">Dinheiro</option>
      <option value="pix">Pix</option>
      <option value="cartao">Cartão</option>
    </select>

    <template x-if="paymentMethod === 'dinheiro'">
      <div>
        <label class="block mb-2">Troco para quanto?</label>
        <input
          type="number"
          class="border p-2 w-full mb-3"
          x-model.number="changeFor"
        />
      </div>
    </template>

    <p class="text-lg font-bold mb-2" x-text="'Total: R$ ' + orderTotal().toFixed(2)"></p>

    <button
      class="bg-blue-600 text-white p-3 w-full rounded"
      @click="confirmOrder()"
    >
      Confirmar e Imprimir
    </button>

    <p class="mt-3 text-sm" x-text="statusMessage"></p>

    <h2 class="text-lg font-bold mt-8 mb-2">Pedidos de Hoje</h2>
    <ul>
      <template x-for="o in todayOrders" :key="o.id">
        <li
          class="border-b py-2 text-sm"
          x-text="o.customerPhone + ' - R$ ' + o.total.toFixed(2)"
        ></li>
      </template>
    </ul>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js");
      }
    </script>
  </body>
</html>
