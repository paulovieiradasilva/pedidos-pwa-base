<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pedidos</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192-sacola.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192-sacola.png" />
    <script src="config.js"></script>
    <script src="vendor/tailwind.js"></script>
    <script type="module" src="js/app.js"></script>
    <script>
      document.title = window.APP_CONFIG?.businessName ?? document.title;
    </script>
    <style>
      select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: none;
      }
      select::-ms-expand {
        display: none;
      }
      /* Esconde a barra de rolagem das áreas de lista/formulário — em
         celular a rolagem por toque não precisa dela, e mostrá-la tomava
         espaço lateral e cortava conteúdo perto da borda. */
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>

  <body
    class="bg-gray-50 px-4 max-w-md mx-auto flex flex-col"
    style="height: 100dvh"
    x-data="pedidosApp"
    x-init="init()"
  >
    <!-- ===== NAVEGAÇÃO PRINCIPAL (abas Pedidos / Produtos / Histórico) =====
         De volta pro topo (era no rodapé, mas colava na barra de gestos do
         Android e ficava sobrando espaço mudando de aparelho pra aparelho —
         mais simples deixar no topo, como sempre foi). "shrink-0" garante
         que ela nunca encolhe no layout flex do body (ver abaixo). O padding
         de cima é o que evita ficar embaixo do notch/Dynamic Island. -->
    <nav
      class="shrink-0 flex border-b border-gray-200 mb-5"
      style="padding-top: max(0.75rem, env(safe-area-inset-top))"
    >
      <button
        class="flex-1 pb-3 flex flex-col items-center gap-1"
        :class="currentView === 'pedidosDoDia' ? 'font-semibold text-gray-900 border-b-2 border-gray-900' : 'text-gray-400'"
        @click="setView('pedidosDoDia')"
      >
        <span x-html="icon('receipt', 22)"></span>
        <span class="text-xs">Pedidos</span>
      </button>
      <button
        class="flex-1 pb-3 flex flex-col items-center gap-1"
        :class="currentView === 'produtos' ? 'font-semibold text-gray-900 border-b-2 border-gray-900' : 'text-gray-400'"
        @click="setView('produtos')"
      >
        <span x-html="icon('tag', 22)"></span>
        <span class="text-xs">Produtos</span>
      </button>
      <button
        class="flex-1 pb-3 flex flex-col items-center gap-1"
        :class="currentView === 'historico' ? 'font-semibold text-gray-900 border-b-2 border-gray-900' : 'text-gray-400'"
        @click="setView('historico')"
      >
        <span x-html="icon('history', 22)"></span>
        <span class="text-xs">Histórico</span>
      </button>
      <!-- Botão ☰ do menu lateral (backup/restaurar). Vira ✕ quando o menu abre e
           fica acima da gaveta (z-50), no mesmo ponto da tela. O ponto âmbar
           avisa que o backup está atrasado. -->
      <span class="shrink-0 pb-3 pl-1 self-stretch flex items-center relative z-50">
        <button
          type="button"
          class="text-gray-500 w-11 h-11 -mr-2 flex items-center justify-center relative"
          :aria-label="menuOpen ? 'Fechar menu' : 'Abrir menu'"
          @click="toggleMenu()"
        >
          <span
            class="pointer-events-none"
            x-html="menuOpen ? icon('close', 24) : icon('menu', 24)"
          ></span>
          <template x-if="backupOverdue && !menuOpen">
            <span
              class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-amber-500 border-2 border-gray-50"
            ></span>
          </template>
        </button>
      </span>
    </nav>

    <!-- ===== MENU LATERAL (gaveta à direita): backup, restaurar, dados protegidos =====
         Fica fora do <nav> pra o overlay cobrir a tela toda. -->
    <div
      class="fixed inset-0 z-40 max-w-md mx-auto overflow-hidden"
      :class="menuOpen ? '' : 'pointer-events-none'"
    >
        <div
          x-show="menuOpen"
          x-transition:enter="transition-opacity ease-out duration-300"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          x-transition:leave="transition-opacity ease-in duration-200"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          class="absolute inset-0 bg-gray-900/50"
          style="display: none"
          @click="menuOpen = false"
        ></div>
        <div
          x-show="menuOpen"
          x-transition:enter="transition-transform ease-out duration-300"
          x-transition:enter-start="translate-x-full"
          x-transition:enter-end="translate-x-0"
          x-transition:leave="transition-transform ease-in duration-200"
          x-transition:leave-start="translate-x-0"
          x-transition:leave-end="translate-x-full"
          class="absolute top-0 bottom-0 right-0 w-[78%] bg-white shadow-xl flex flex-col"
          style="display: none; padding-top: max(0.75rem, env(safe-area-inset-top))"
        >
          <div class="px-4 pt-3 pb-3 pr-14 border-b border-gray-100">
            <div class="text-base font-bold">Menu</div>
            <div class="text-xs text-gray-500">Seus dados</div>
          </div>

          <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar py-1">
            <button
              type="button"
              class="flex items-center gap-3 w-full text-left px-4 py-3"
              @click="shareBackup()"
            >
              <span class="text-gray-500 shrink-0" x-html="icon('share', 20)"></span>
              <span class="min-w-0 flex-1">
                <span class="block text-sm text-gray-800">Fazer backup</span>
                <span class="block text-xs text-gray-400" x-text="'Último: ' + lastBackupLabel().toLowerCase()"></span>
                <span class="block text-xs text-gray-400">Envie pro seu WhatsApp, Drive ou e-mail — fora do celular.</span>
              </span>
              <template x-if="backupOverdue">
                <span class="shrink-0 text-[10px] bg-amber-50 text-amber-800 rounded-full px-2 py-0.5">Atrasado</span>
              </template>
            </button>

            <button
              type="button"
              class="flex items-center gap-3 w-full text-left px-4 py-3"
              @click="pickRestoreFile()"
            >
              <span class="text-gray-500 shrink-0" x-html="icon('download', 20)"></span>
              <span class="min-w-0">
                <span class="block text-sm text-gray-800">Restaurar backup</span>
                <span class="block text-xs text-gray-400">Trocou de celular?</span>
              </span>
            </button>

            <div class="flex items-center gap-3 px-4 py-3">
              <span class="text-gray-500 shrink-0" x-html="icon('shield', 20)"></span>
              <span class="text-sm text-gray-800 flex-1">Dados protegidos</span>
              <span
                class="shrink-0 text-[10px] rounded-full px-2 py-0.5"
                :class="storagePersisted ? 'bg-green-50 text-green-800' : 'bg-gray-100 text-gray-600'"
                x-text="storagePersisted ? 'Sim' : 'Não'"
              ></span>
            </div>

            <!-- Só com config.js features.devMode = true -->
            <template x-if="devModeEnabled()">
              <div class="border-t border-gray-100 mt-1 pt-1">
                <button
                  type="button"
                  class="flex items-center gap-3 w-full text-left px-4 py-3 text-red-600"
                  @click="clearDatabase()"
                >
                  <span class="shrink-0" x-html="icon('trash', 20)"></span>
                  <span class="min-w-0">
                    <span class="block text-sm">Limpar dados</span>
                    <span class="block text-xs text-red-300">Só modo desenvolvedor</span>
                  </span>
                </button>
              </div>
            </template>
          </div>

          <p
            class="shrink-0 px-4 py-2 border-t border-gray-100 text-[10px] text-gray-300"
            style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom))"
            x-text="appVersionInfo"
          ></p>
        </div>
    </div>

    <input
      type="file"
      accept="application/json,.json,text/plain,.txt"
      class="hidden"
      x-ref="restoreInput"
      @change="onRestoreFileChosen($event)"
    />

    <!-- Confirmação antes de substituir os dados pelo backup escolhido -->
    <template x-if="restorePending">
      <div class="fixed inset-0 z-[60] max-w-md mx-auto flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/50" @click="cancelRestore()"></div>
        <div class="relative bg-white rounded-2xl p-4 w-full shadow-xl">
          <div class="text-base font-bold mb-1">Restaurar este backup?</div>
          <p
            class="text-xs text-gray-500 mb-3"
            x-text="'Arquivo de ' + new Date(restorePending.exportedAt).toLocaleDateString('pt-BR') + '.'"
          ></p>
          <div class="text-sm mb-3">
            <div class="flex justify-between py-1 border-b border-gray-100"><span class="text-gray-500">Pedidos</span><span x-text="restorePending.counts.orders"></span></div>
            <div class="flex justify-between py-1 border-b border-gray-100"><span class="text-gray-500">Produtos</span><span x-text="restorePending.counts.products"></span></div>
            <div class="flex justify-between py-1"><span class="text-gray-500">Clientes</span><span x-text="restorePending.counts.customers"></span></div>
          </div>
          <p class="text-xs text-red-700 mb-3">Isso substitui todos os dados deste aparelho.</p>
          <button
            type="button"
            class="bg-red-600 text-white p-2 w-full rounded-lg font-semibold mb-2"
            @click="confirmRestore()"
          >
            Restaurar
          </button>
          <button
            type="button"
            class="border border-gray-300 text-gray-700 bg-white p-2 w-full rounded-lg"
            @click="cancelRestore()"
          >
            Cancelar
          </button>
        </div>
      </div>
    </template>

    <!-- ===== ÁREA PRINCIPAL (a aba atual) =====
         "flex-1 min-h-0" faz essa área preencher todo o espaço entre a nav
         e o rodapé de versão, sem estourar a altura do body (o "min-h-0" é
         o que permite um filho com scroll interno funcionar dentro de um
         flex item — sem ele o flexbox deixa crescer do tamanho do conteúdo
         e a rolagem interna nunca ativa). -->
    <main class="flex-1 min-h-0 flex flex-col">
      <!-- ===== ABA: PEDIDOS DO DIA ===== -->
      <template x-if="currentView === 'pedidosDoDia'">
        <div class="h-full flex flex-col">
          <div class="shrink-0">
            <div class="flex justify-between items-baseline mb-4">
              <h1 class="text-xl font-bold">Pedidos</h1>
              <button
                class="text-sm font-semibold px-3 py-2 rounded-lg"
                :class="showOrderForm ? 'border border-blue-200 text-blue-700 bg-white' : 'bg-blue-600 text-white'"
                @click="showOrderForm ? closeOrderForm() : openNewOrderForm()"
              >
                <span
                  x-html="showOrderForm ? 'Cancelar' : icon('add') + ' Novo pedido'"
                ></span>
              </button>
            </div>
          </div>

          <!-- Formulário de novo pedido / edição (é a própria área rolável
             quando aberto) -->
          <template x-if="showOrderForm">
            <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar pb-4">
              <!-- Busca de cliente por telefone (com autocomplete) e endereço -->
              <div
                class="bg-white rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.16),0_1px_3px_rgba(0,0,0,0.10)] p-3 mb-4"
              >
                <button
                  type="button"
                  class="flex items-center justify-between gap-1.5 w-full"
                  :class="clienteCardCollapsed ? '' : 'mb-3'"
                  @click="toggleClienteCard()"
                >
                  <span class="flex items-center gap-1.5 min-w-0">
                    <span class="text-blue-600 shrink-0" x-html="icon('person')"></span>
                    <span
                      class="text-xs font-semibold text-blue-600 uppercase tracking-wide"
                      >Cliente</span
                    >
                  </span>
                  <span
                    class="text-gray-400 shrink-0 transition-transform"
                    :class="clienteCardCollapsed && '-rotate-90'"
                    x-html="icon('chevronDown', 18)"
                  ></span>
                </button>
                <template x-if="!clienteCardCollapsed">
                  <div>
                    <template x-if="customerMatchStatus">
                      <span
                        class="inline-block text-xs px-2 py-0.5 rounded-full mb-2"
                        :class="customerMatchStatus === 'existing' ? 'bg-green-50 text-green-700' : 'bg-gray-100 text-gray-600'"
                        x-text="customerMatchStatus === 'existing' ? 'Cliente existente' : 'Cliente novo'"
                      ></span>
                    </template>
                    <div class="relative mb-3">
                      <input
                        type="tel"
                        inputmode="numeric"
                        maxlength="15"
                        placeholder="(11) 99999-8888"
                        class="border rounded-lg p-2 w-full"
                        :value="phone"
                        @input="onPhoneInput($event)"
                        @blur="lookupCustomer()"
                      />
                      <template x-if="phoneSuggestions.length > 0">
                        <ul
                          class="absolute left-0 right-0 bg-white border rounded-xl shadow-md mt-1 z-10 max-h-56 overflow-y-auto"
                        >
                          <template x-for="c in phoneSuggestions" :key="c.phone">
                            <li
                              class="p-2 text-sm border-b last:border-b-0"
                              @mousedown.prevent="selectPhoneSuggestion(c)"
                            >
                              <span
                                class="font-medium"
                                x-text="formatPhoneMask(c.phone)"
                              ></span>
                              <span
                                class="text-gray-600"
                                x-text="' · ' + c.address"
                              ></span>
                            </li>
                          </template>
                        </ul>
                      </template>
                    </div>
                    <template x-if="phoneError">
                      <p
                        class="text-xs text-red-600 -mt-2 mb-3"
                        x-text="phoneError"
                      ></p>
                    </template>
                    <div class="relative mb-3">
                      <input
                        type="text"
                        placeholder="Endereço"
                        class="border rounded-lg p-2 w-full"
                        :value="address"
                        @input="onAddressInput($event.target.value)"
                      />
                      <template x-if="addressSuggestions.length > 0">
                        <ul
                          class="absolute left-0 right-0 bg-white border rounded-xl shadow-md mt-1 z-10 max-h-56 overflow-y-auto"
                        >
                          <template x-for="c in addressSuggestions" :key="c.phone">
                            <li
                              class="p-2 text-sm border-b last:border-b-0"
                              @mousedown.prevent="selectAddressSuggestion(c)"
                            >
                              <span class="font-medium" x-text="c.address"></span>
                              <span
                                class="text-gray-600"
                                x-text="' · ' + formatPhoneMask(c.phone)"
                              ></span>
                            </li>
                          </template>
                        </ul>
                      </template>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Seleção de produto e quantidade/peso, e lista de itens do carrinho -->
              <div
                class="bg-white rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.16),0_1px_3px_rgba(0,0,0,0.10)] p-3 mb-4"
              >
                <button
                  type="button"
                  class="flex items-center justify-between gap-1.5 w-full"
                  :class="productCardCollapsed ? '' : 'mb-3'"
                  @click="toggleProductCard()"
                >
                  <span class="flex items-center gap-1.5 min-w-0">
                    <span class="text-blue-600 shrink-0" x-html="icon('package')"></span>
                    <span
                      class="text-xs font-semibold text-blue-600 uppercase tracking-wide"
                      >Adicionar produto</span
                    >
                  </span>
                  <span
                    class="text-gray-400 shrink-0 transition-transform"
                    :class="productCardCollapsed && '-rotate-90'"
                    x-html="icon('chevronDown', 18)"
                  ></span>
                </button>
                <template x-if="!productCardCollapsed">
                  <div>
                    <!-- Lista própria (não é <select> nativo) pra poder mostrar nome e marca
                       em linhas separadas — sem preço aqui, porque ele muda de acordo com a
                       forma de pagamento, escolhida só depois no carrinho. -->
                    <div class="relative mb-3">
                      <button
                        type="button"
                        class="border rounded-lg p-2 w-full flex items-center justify-between gap-2 bg-white"
                        x-ref="selectOpen"
                        @click.stop="toggleProductPicker()"
                      >
                        <span
                          class="truncate text-left"
                          :class="selectedNewOrderProduct() ? 'text-gray-900' : 'text-gray-500'"
                          x-text="selectedNewOrderProduct() ? selectedNewOrderProduct().name : 'Selecione um produto'"
                        ></span>
                        <span
                          class="text-gray-500 shrink-0"
                          x-html="icon('chevronDown')"
                        ></span>
                      </button>
                      <template x-if="productPickerOpen">
                        <div
                          class="absolute left-0 right-0 mt-1 bg-white border rounded-xl shadow-md z-20 overflow-hidden"
                          @click.outside="productPickerOpen = false"
                        >
                          <!-- Busca por nome/marca (fica fixa no topo, fora da área que rola) -->
                          <div class="p-2 border-b">
                            <div class="relative">
                              <input
                                type="text"
                                placeholder="Buscar produto"
                                class="border rounded-lg p-2 pr-8 w-full text-sm"
                                x-model="productPickerQuery"
                                x-init="$nextTick(() => $el.focus())"
                              />
                              <template x-if="productPickerQuery.trim()">
                                <button
                                  type="button"
                                  class="absolute right-1.5 top-1/2 -translate-y-1/2 text-gray-400"
                                  aria-label="Limpar busca"
                                  @click="productPickerQuery = ''"
                                >
                                  <span
                                    class="pointer-events-none"
                                    x-html="icon('close', 14)"
                                  ></span>
                                </button>
                              </template>
                            </div>
                          </div>
                          <div class="max-h-56 overflow-y-auto">
                            <template
                              x-for="p in filteredActiveProducts()"
                              :key="p.id"
                            >
                              <button
                                type="button"
                                class="flex items-center justify-between gap-2 w-full text-left px-3 py-2 border-b last:border-b-0"
                                :class="p.id === selectedProductId && 'bg-blue-50'"
                                @click="chooseOrderProduct(p.id)"
                              >
                                <span class="min-w-0">
                                  <span
                                    class="block text-sm font-medium truncate"
                                    x-text="p.name"
                                  ></span>
                                  <template x-if="p.brand">
                                    <span
                                      class="block text-xs text-gray-500 truncate"
                                      x-text="p.brand"
                                    ></span>
                                  </template>
                                </span>
                                <template x-if="p.id === selectedProductId">
                                  <span
                                    class="text-blue-600 shrink-0"
                                    x-html="icon('check', 16)"
                                  ></span>
                                </template>
                              </button>
                            </template>
                            <template x-if="filteredActiveProducts().length === 0">
                              <p class="text-sm text-gray-600 px-3 py-2">
                                Nenhum produto encontrado.
                              </p>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>

                    <template x-if="!selectedNewOrderProduct()?.soldByWeight">
                      <div>
                        <label class="block mb-1 text-sm">Quantidade</label>
                        <input
                          type="number"
                          min="1"
                          class="border rounded-lg p-2 w-full mb-3"
                          :value="qty"
                          @input="onQtyInput($event.target.value)"
                        />
                      </div>
                    </template>

                    <template x-if="selectedNewOrderProduct()?.soldByWeight">
                      <div>
                        <label class="block mb-1 text-sm">Gramas</label>
                        <input
                          type="number"
                          min="1"
                          placeholder="500, 1000, 1200..."
                          class="border rounded-lg p-2 w-full mb-2"
                          :value="weightGrams"
                          @input="onWeightGramsInput($event.target.value)"
                        />
                        <label class="block mb-1 text-sm"
                          >Valor (ajuste se necessário)</label
                        >
                        <input
                          type="number"
                          step="0.01"
                          class="border rounded-lg p-2 w-full mb-3"
                          :value="weightManualTotal"
                          @input="onWeightTotalInput($event.target.value)"
                        />
                      </div>
                    </template>

                    <button
                      type="button"
                      class="border border-gray-300 text-gray-700 bg-white p-2 w-full rounded-lg text-sm font-medium mb-3"
                      x-html="editingCartItemIndex !== null ? 'Atualizar item' : icon('add') + ' Adicionar item'"
                      @click="addCartItem()"
                    ></button>

                    <h2 class="font-medium text-sm mb-2 mt-1">Itens do pedido</h2>
                    <template x-if="cartItems.length === 0">
                      <p class="text-sm text-gray-600 mb-3">
                        Nenhum item adicionado ainda.
                      </p>
                    </template>
                    <div class="flex flex-col gap-1 mb-3">
                      <template x-for="(item, index) in cartItems" :key="index">
                        <div
                          class="flex justify-between items-center text-sm border-b last:border-b-0 py-1"
                          :class="editingCartItemIndex === index && 'bg-blue-50 -mx-1 px-1 rounded'"
                        >
                          <span
                            class="truncate cursor-pointer"
                            @click="startEditCartItem(index)"
                            x-text="(item.grams != null ? (item.grams / 1000) + 'kg' : item.qty + 'x') + ' ' + item.productName"
                          ></span>
                          <span class="flex items-center gap-2 shrink-0">
                            <template x-if="paymentMethod">
                              <span
                                x-text="'R$ ' + formatCurrency(cartItemLineTotal(item))"
                              ></span>
                            </template>
                            <button
                              type="button"
                              class="text-gray-500 w-7 h-7 flex items-center justify-center"
                              aria-label="Remover item"
                              x-html="icon('close', 18)"
                              @click="removeCartItem(index)"
                            ></button>
                          </span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Forma de pagamento e cálculo de troco -->
              <div
                class="bg-white rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.16),0_1px_3px_rgba(0,0,0,0.10)] p-3 mb-4"
              >
                <label class="block mb-2 text-sm">Pagamento</label>
                <div class="flex gap-2">
                  <button
                    type="button"
                    class="flex-1 p-2 rounded-lg text-sm font-medium"
                    :class="paymentButtonClass('dinheiro')"
                    x-html="icon('dinheiro') + ' Dinheiro'"
                    @click="paymentMethod = 'dinheiro'"
                  ></button>
                  <button
                    type="button"
                    class="flex-1 p-2 rounded-lg text-sm font-medium"
                    :class="paymentButtonClass('pix')"
                    x-html="icon('pix') + ' Pix'"
                    @click="paymentMethod = 'pix'"
                  ></button>
                  <button
                    type="button"
                    class="flex-1 p-2 rounded-lg text-sm font-medium"
                    :class="paymentButtonClass('cartao')"
                    x-html="icon('cartao') + ' Cartão'"
                    @click="paymentMethod = 'cartao'"
                  ></button>
                </div>

                <template x-if="paymentMethod === 'dinheiro'">
                  <div class="mt-3">
                    <label class="block mb-1 text-sm">Troco para quanto?</label>
                    <input
                      type="number"
                      class="border rounded-lg p-2 w-full"
                      x-model.number="changeFor"
                    />
                    <template
                      x-if="changeFor != null && changeFor >= orderTotal()"
                    >
                      <p
                        class="text-sm text-gray-700 mt-1 flex justify-between"
                      >
                        <span>Troco</span>
                        <span
                          x-text="'R$ ' + formatCurrency(changeAmountLive())"
                        ></span>
                      </p>
                    </template>
                  </div>
                </template>
              </div>

              <div class="flex justify-between items-baseline mb-3">
                <span class="text-lg text-gray-600">Total</span>
                <span
                  class="text-2xl font-bold"
                  x-text="'R$ ' + formatCurrency(orderTotal())"
                ></span>
              </div>

              <button
                class="bg-blue-600 text-white p-3 w-full rounded-xl font-semibold"
                @click="saveOrder()"
              >
                <span
                  x-text="editingOrderId ? 'Salvar alterações' : 'Gravar pedido'"
                ></span>
              </button>
            </div>
          </template>

          <!-- Lista de pedidos: busca em todo o histórico, filtro por dia/status/pagamento,
             seleção em massa + impressão, paginação. Busca/filtros ficam
             fixos; só os cards + paginação rolam. -->
          <template x-if="!showOrderForm">
            <div class="flex-1 min-h-0 flex flex-col">
              <div class="shrink-0">
                <div class="relative mb-3">
                  <input
                    type="text"
                    placeholder="Buscar por telefone ou endereço"
                    class="border rounded-lg p-2 pr-9 w-full"
                    :value="orderSearchQuery"
                    @input="onOrderSearchInput($event.target.value)"
                  />
                  <template x-if="orderSearchQuery.trim()">
                    <button
                      type="button"
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400"
                      aria-label="Limpar busca"
                      @click="clearOrderSearch()"
                    >
                      <span
                        class="pointer-events-none"
                        x-html="icon('close', 16)"
                      ></span>
                    </button>
                  </template>
                </div>

                <template x-if="!orderSearchQuery.trim()">
                  <div class="flex items-center gap-2 mb-3">
                    <button
                      type="button"
                      class="border rounded-lg p-2 text-gray-600 shrink-0"
                      aria-label="Dia anterior"
                      @click="shiftDate(-1)"
                      x-html="icon('chevronLeft')"
                    ></button>
                    <div class="relative flex-1">
                      <div
                        class="border rounded-lg p-2 pr-9 w-full bg-white"
                        x-text="formatDateDisplay(selectedDate)"
                      ></div>
                      <input
                        type="date"
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                        x-model="selectedDate"
                        @change="refreshOrders()"
                      />
                      <span
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"
                        x-html="icon('calendar')"
                      ></span>
                    </div>
                    <button
                      type="button"
                      class="border rounded-lg p-2 text-gray-600 shrink-0"
                      aria-label="Próximo dia"
                      @click="shiftDate(1)"
                      x-html="icon('chevronRight')"
                    ></button>
                    <span
                      class="text-sm text-gray-600 whitespace-nowrap"
                      x-text="filteredOrders().length + ' pedido(s)'"
                    ></span>
                  </div>
                </template>
                <template x-if="orderSearchQuery.trim()">
                  <p
                    class="text-sm text-gray-600 mb-3"
                    x-text="orderSearchResults.length + ' resultado(s) para \'' + orderSearchQuery.trim() + '\''"
                  ></p>
                </template>

                <div class="flex gap-3 mb-3 border-b border-gray-200">
                  <button
                    class="text-sm pb-2"
                    :class="orderStatusTab === 'pendente' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
                    @click="setOrderStatusTab('pendente')"
                  >
                    Pendente
                  </button>
                  <button
                    class="text-sm pb-2"
                    :class="orderStatusTab === 'impresso' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
                    @click="setOrderStatusTab('impresso')"
                  >
                    Impresso
                  </button>
                  <button
                    class="text-sm pb-2"
                    :class="orderStatusTab === 'entregue' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
                    @click="setOrderStatusTab('entregue')"
                  >
                    Entregue
                  </button>
                  <button
                    class="text-sm pb-2"
                    :class="orderStatusTab === 'cancelado' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
                    @click="setOrderStatusTab('cancelado')"
                  >
                    Cancelado
                  </button>
                </div>

                <template
                  x-if="orderStatusTab === 'pendente' && selectedOrderIds.length > 0"
                >
                  <button
                    class="w-full mb-3 p-2 bg-blue-600 text-white rounded-lg text-sm font-semibold"
                    @click="printSelectedOrders()"
                    x-text="'Imprimir selecionados (' + selectedOrderIds.length + ')'"
                  ></button>
                </template>

                <div class="flex items-center gap-2 mb-3 text-xs">
                  <label
                    class="flex items-center gap-1 border rounded-full h-8 px-3 cursor-pointer"
                    :class="paymentFilter.dinheiro ? 'border-green-200 bg-green-50 text-green-800' : 'border-gray-300 text-gray-500'"
                    title="Dinheiro"
                  >
                    <input
                      type="checkbox"
                      class="sr-only"
                      x-model="paymentFilter.dinheiro"
                      @change="onFilterChange()"
                    />
                    <span
                      aria-hidden="true"
                      x-html="icon('dinheiro', 18)"
                    ></span>
                  </label>
                  <label
                    class="flex items-center gap-1 border rounded-full h-8 px-3 cursor-pointer"
                    :class="paymentFilter.pix ? 'border-blue-200 bg-blue-50 text-blue-800 font-medium' : 'border-gray-300 text-gray-500'"
                    title="Pix"
                  >
                    <input
                      type="checkbox"
                      class="sr-only"
                      x-model="paymentFilter.pix"
                      @change="onFilterChange()"
                    />
                    <span x-html="icon('pix') + ' Pix'"></span>
                  </label>
                  <label
                    class="flex items-center gap-1 border rounded-full h-8 px-3 cursor-pointer"
                    :class="paymentFilter.cartao ? 'border-purple-200 bg-purple-50 text-purple-800' : 'border-gray-300 text-gray-500'"
                    title="Cartão"
                  >
                    <input
                      type="checkbox"
                      class="sr-only"
                      x-model="paymentFilter.cartao"
                      @change="onFilterChange()"
                    />
                    <span aria-hidden="true" x-html="icon('cartao', 18)"></span>
                  </label>

                  <div class="relative ml-auto shrink-0">
                    <select
                      class="appearance-none border border-gray-300 rounded-full h-8 pl-3 pr-6 text-xs text-gray-600 bg-white"
                      aria-label="Itens por página"
                      :value="orderPageSize"
                      @change="onOrderPageSizeChange($event.target.value)"
                    >
                      <option value="5">5</option>
                      <option value="10">10</option>
                      <option value="15">15</option>
                      <option value="30">30</option>
                      <option value="50">50</option>
                    </select>
                    <span
                      class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-gray-400"
                      x-html="icon('chevronDown', 12)"
                    ></span>
                  </div>
                  <button
                    type="button"
                    class="border border-gray-300 rounded-full w-8 h-8 flex items-center justify-center text-gray-600 shrink-0"
                    :aria-label="orderSortDirection === 'desc' ? 'Mostrando mais recentes primeiro, tocar para inverter' : 'Mostrando mais antigos primeiro, tocar para inverter'"
                    @click="toggleOrderSort()"
                  >
                    <span
                      class="pointer-events-none"
                      x-html="icon('sort', 16)"
                    ></span>
                  </button>
                </div>
              </div>

              <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar pb-4">
                <template x-if="currentOrders().length === 0">
                  <p
                    class="text-sm text-gray-600"
                    x-text="orderSearchQuery.trim() ? 'Nenhum pedido encontrado para essa busca.' : 'Nenhum pedido nesse dia.'"
                  ></p>
                </template>
                <template
                  x-if="currentOrders().length > 0 && filteredOrders().length === 0"
                >
                  <p class="text-sm text-gray-600">
                    Nenhum pedido nessa aba com esse filtro.
                  </p>
                </template>

                <div class="flex flex-col gap-2">
                  <template x-for="o in visibleOrders()" :key="o.id">
                    <div
                      class="bg-white rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.16),0_1px_3px_rgba(0,0,0,0.10)] p-3 border-l-4"
                      :class="paymentMethodAccentClass(o.paymentMethod)"
                    >
                      <div class="flex justify-between items-baseline gap-2">
                        <span class="flex items-center gap-2 min-w-0">
                          <template x-if="orderStatusTab === 'pendente'">
                            <input
                              type="checkbox"
                              :checked="selectedOrderIds.includes(o.id)"
                              @change="toggleOrderSelected(o.id)"
                            />
                          </template>
                          <span
                            class="text-sm font-medium truncate"
                            x-text="new Date(o.createdAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' · ' + formatPhoneMask(o.customerPhone)"
                          ></span>
                        </span>
                        <span class="flex items-center shrink-0">
                          <span
                            class="text-base font-bold"
                            x-text="'R$ ' + formatCurrency(o.total)"
                          ></span>
                          <span
                            class="relative"
                            x-show="orderStatusTab === 'pendente' || orderStatusTab === 'impresso'"
                          >
                            <button
                              type="button"
                              class="text-gray-400 w-9 h-9 flex items-center justify-center -mr-1.5"
                              aria-label="Mais opções"
                              @click.stop="toggleOrderMenu(o.id)"
                            >
                              <span
                                class="pointer-events-none"
                                x-html="icon('moreVertical', 18)"
                              ></span>
                            </button>
                            <template x-if="openOrderMenuId === o.id">
                              <div
                                class="absolute right-0 mt-1 bg-white border rounded-lg shadow-md z-20 overflow-hidden"
                                @click.outside="openOrderMenuId = null"
                              >
                                <button
                                  type="button"
                                  class="flex items-center gap-2 px-3 py-2 text-sm text-red-600 whitespace-nowrap"
                                  @click="deleteOrder(o)"
                                >
                                  <span
                                    class="pointer-events-none"
                                    x-html="icon('trash', 16)"
                                  ></span>
                                  Excluir definitivamente
                                </button>
                              </div>
                            </template>
                          </span>
                        </span>
                      </div>
                      <p
                        class="text-xs py-1 text-gray-500"
                        x-text="formatOrderDate(o)"
                      ></p>
                      <template x-if="o.address">
                        <p
                          class="text-xs text-gray-600 flex items-center gap-1"
                        >
                          <span
                            class="shrink-0"
                            x-html="icon('location')"
                          ></span>
                          <span class="truncate" x-text="o.address"></span>
                        </p>
                      </template>
                      <ul class="mt-1 flex flex-col gap-0.5">
                        <template
                          x-for="label in orderItemLabels(o)"
                          :key="label"
                        >
                          <li class="text-xs text-gray-600" x-text="label"></li>
                        </template>
                      </ul>
                      <div
                        class="flex justify-between items-center mt-1.5 pt-1.5 border-t border-gray-100"
                      >
                        <span class="flex items-center gap-1.5">
                          <span
                            class="text-xs font-medium"
                            :class="paymentMethodTextClass(o.paymentMethod)"
                            :title="paymentMethodLabel(o.paymentMethod)"
                            x-html="icon(o.paymentMethod, 18)"
                          ></span>
                          <template
                            x-if="o.paymentMethod === 'dinheiro' && o.changeAmount > 0"
                          >
                            <span
                              class="text-xs text-gray-500"
                              x-text="'Troco: R$ ' + formatCurrency(o.changeAmount)"
                            ></span>
                          </template>
                        </span>
                        <div class="flex gap-3 text-xs font-medium">
                          <template
                            x-if="orderStatusTab === 'pendente' || orderStatusTab === 'impresso'"
                          >
                            <span
                              class="text-blue-600 cursor-pointer"
                              @click="startEditOrder(o)"
                              >Editar</span
                            >
                          </template>
                          <template x-if="orderStatusTab === 'impresso'">
                            <span
                              class="text-blue-600 cursor-pointer"
                              @click="markOrderDelivered(o)"
                              >Marcar entregue</span
                            >
                          </template>
                          <template
                            x-if="orderStatusTab === 'pendente' || orderStatusTab === 'impresso'"
                          >
                            <span
                              class="text-red-600 cursor-pointer"
                              @click="cancelOrder(o)"
                              >Cancelar</span
                            >
                          </template>
                          <template x-if="orderStatusTab === 'cancelado'">
                            <span
                              class="text-blue-600 cursor-pointer"
                              @click="revertOrderToPending(o)"
                              >Reverter pra pendente</span
                            >
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>

                <template x-if="totalOrderPages() > 1">
                  <div class="flex items-center justify-center gap-3 mt-3">
                    <button
                      type="button"
                      class="border rounded-lg p-2 text-gray-600 disabled:opacity-40"
                      aria-label="Página anterior"
                      :disabled="orderPage <= 1"
                      @click="prevOrderPage()"
                      x-html="icon('chevronLeft')"
                    ></button>
                    <span
                      class="text-sm text-gray-600"
                      x-text="'Página ' + orderPage + ' de ' + totalOrderPages()"
                    ></span>
                    <button
                      type="button"
                      class="border rounded-lg p-2 text-gray-600 disabled:opacity-40"
                      aria-label="Próxima página"
                      :disabled="orderPage >= totalOrderPages()"
                      @click="nextOrderPage()"
                      x-html="icon('chevronRight')"
                    ></button>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== ABA: PRODUTOS ===== -->
      <template x-if="currentView === 'produtos'">
        <div class="h-full flex flex-col">
          <!-- Cabeçalho fixo (não rola) -->
          <div class="shrink-0">
            <div class="flex justify-between items-baseline mb-4">
              <h1 class="text-xl font-bold">Produtos</h1>
              <button
                class="text-sm font-semibold px-3 py-2 rounded-lg"
                :class="showProductForm ? 'border border-blue-200 text-blue-700 bg-white' : 'bg-blue-600 text-white'"
                @click="showProductForm ? closeProductForm() : openNewProductForm()"
              >
                <span
                  x-html="showProductForm ? 'Cancelar' : icon('add') + ' Novo produto'"
                ></span>
              </button>
            </div>
          </div>

          <!-- Formulário de cadastro/edição de produto (é a própria área
             rolável quando aberto) -->
          <template x-if="showProductForm">
            <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar pb-4">
              <div
                class="bg-white rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.16),0_1px_3px_rgba(0,0,0,0.10)] p-3 mb-4"
              >
                <div class="flex items-center gap-1.5 mb-3">
                  <span class="text-blue-600" x-html="icon('package')"></span>
                  <span
                    class="text-xs font-semibold text-blue-600 uppercase tracking-wide"
                    x-text="productForm.id ? 'Editar produto' : 'Novo produto'"
                  ></span>
                </div>

                <label class="block mb-1 text-sm">Nome</label>
                <input
                  type="text"
                  class="border rounded-lg p-2 w-full mb-2"
                  x-model="productForm.name"
                />

                <label class="block mb-1 text-sm">Marca (opcional)</label>
                <input
                  type="text"
                  class="border rounded-lg p-2 w-full mb-2"
                  x-model="productForm.brand"
                />

                <template x-if="soldByWeightEnabled()">
                  <label class="flex items-center gap-2 text-sm mb-2">
                    <input type="checkbox" x-model="productForm.soldByWeight" />
                    Vendido por peso (kg)
                  </label>
                </template>

                <template x-if="!productForm.soldByWeight">
                  <div>
                    <label class="block mb-1 text-sm">Preço</label>
                    <div class="flex items-center gap-2 mb-1">
                      <span
                        class="w-24 text-sm shrink-0"
                        x-html="icon('dinheiro') + ' Dinheiro'"
                      ></span>
                      <input
                        type="number"
                        step="0.01"
                        class="border rounded-lg p-2 flex-1 min-w-0"
                        :value="productForm.priceDinheiro"
                        @input="onPriceDinheiroInput($event.target.value)"
                      />
                    </div>
                    <div class="flex items-center gap-2 mb-1">
                      <span
                        class="w-24 text-sm shrink-0 text-blue-700 font-medium"
                        x-html="icon('pix') + ' Pix'"
                      ></span>
                      <input
                        type="number"
                        step="0.01"
                        class="border rounded-lg p-2 flex-1 min-w-0"
                        :value="productForm.pricePix"
                        @input="onPricePixInput($event.target.value)"
                      />
                    </div>
                    <div class="flex items-center gap-2 mb-2">
                      <span
                        class="w-24 text-sm shrink-0"
                        x-html="icon('cartao') + ' Cartão'"
                      ></span>
                      <input
                        type="number"
                        step="0.01"
                        class="border rounded-lg p-2 flex-1 min-w-0"
                        :value="productForm.priceCartao"
                        @input="onPriceCartaoInput($event.target.value)"
                      />
                    </div>
                  </div>
                </template>

                <template x-if="productForm.soldByWeight">
                  <div class="mb-2">
                    <label class="block mb-1 text-sm">Preço por kg</label>
                    <input
                      type="number"
                      step="0.01"
                      class="border rounded-lg p-2 w-full"
                      x-model.number="productForm.pricePerKg"
                    />
                  </div>
                </template>

                <p
                  class="text-sm text-red-600 mb-2"
                  x-text="productFormError"
                ></p>

                <div class="flex gap-2">
                  <button
                    class="bg-blue-600 text-white p-2 flex-1 rounded-lg font-semibold"
                    @click="saveProductForm()"
                  >
                    Salvar
                  </button>
                  <button
                    class="border border-gray-300 text-gray-700 bg-white p-2 flex-1 rounded-lg"
                    @click="closeProductForm()"
                  >
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          </template>

          <!-- Lista de produtos (busca, filtro ativos/todos, ativar/desativar).
             Busca+abas ficam fixas; só o grid de cards rola. -->
          <template x-if="!showProductForm">
            <div class="flex-1 min-h-0 flex flex-col">
              <div class="shrink-0">
                <div class="relative mb-2">
                  <input
                    type="text"
                    placeholder="Buscar por nome ou marca"
                    class="border rounded-lg p-2 pr-9 w-full"
                    x-model="productSearch"
                  />
                  <template x-if="productSearch.trim()">
                    <button
                      type="button"
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400"
                      aria-label="Limpar busca"
                      @click="productSearch = ''"
                    >
                      <span
                        class="pointer-events-none"
                        x-html="icon('close', 16)"
                      ></span>
                    </button>
                  </template>
                </div>

                <div class="flex gap-4 mb-3 border-b border-gray-200">
                  <button
                    class="text-sm pb-2"
                    :class="productFilter === 'active' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
                    @click="productFilter = 'active'"
                    x-text="'Ativos (' + activeProductCount() + ')'"
                  ></button>
                  <button
                    class="text-sm pb-2"
                    :class="productFilter === 'all' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
                    @click="productFilter = 'all'"
                    x-text="'Todos (' + products.length + ')'"
                  ></button>
                </div>
              </div>

              <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar pb-4">
                <template x-if="filteredProductList().length === 0">
                  <p class="text-sm text-gray-600">
                    Nenhum produto encontrado.
                  </p>
                </template>

                <div class="flex flex-col gap-2">
                  <template x-for="p in filteredProductList()" :key="p.id">
                    <div
                      class="bg-white rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.16),0_1px_3px_rgba(0,0,0,0.10)] p-3"
                      :class="!p.active && 'opacity-50'"
                    >
                      <div class="flex justify-between items-start gap-2">
                        <div>
                          <p class="text-sm font-medium" x-text="p.name"></p>
                          <template x-if="productSubtitle(p)">
                            <p
                              class="text-xs text-gray-600"
                              x-text="productSubtitle(p)"
                            ></p>
                          </template>
                        </div>
                        <div class="flex gap-1 shrink-0">
                          <button
                            class="bg-gray-100 rounded-lg w-8 h-8 text-sm flex items-center justify-center"
                            aria-label="Editar ..."
                            x-html="icon('edit', 14)"
                            @click="startEditProduct(p)"
                          ></button>
                          <button
                            class="bg-gray-100 rounded-lg w-8 h-8 text-sm flex items-center justify-center"
                            :aria-label="p.active ? 'Desativar' : 'Ativar'"
                            x-html="icon('power', 14)"
                            @click="toggleProductActive(p)"
                          ></button>
                        </div>
                      </div>
                      <div class="flex gap-1 mt-2 flex-wrap">
                        <template x-if="p.soldByWeight">
                          <span
                            class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-700"
                            x-text="'R$ ' + formatCurrency(p.pricePerKg) + '/kg'"
                          ></span>
                        </template>
                        <template x-if="!p.soldByWeight">
                          <span
                            class="text-xs px-2 py-1 rounded-full"
                            :class="paymentMethodPillClass('dinheiro')"
                            title="Dinheiro"
                            x-html="icon('dinheiro', 13) + ' R$ ' + formatCurrency(p.prices.dinheiro)"
                          ></span>
                        </template>
                        <template x-if="!p.soldByWeight">
                          <span
                            class="text-xs px-2 py-1 rounded-full"
                            :class="paymentMethodPillClass('pix')"
                            title="Pix"
                            x-html="icon('pix', 13) + ' Pix R$ ' + formatCurrency(p.prices.pix)"
                          ></span>
                        </template>
                        <template x-if="!p.soldByWeight">
                          <span
                            class="text-xs px-2 py-1 rounded-full"
                            :class="paymentMethodPillClass('cartao')"
                            title="Cartão"
                            x-html="icon('cartao', 13) + ' R$ ' + formatCurrency(p.prices.cartao)"
                          ></span>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== ABA: HISTÓRICO (log de auditoria) =====
         Mostra, por dia, cada edição/cancelamento/exclusão/reversão de pedido
         (não mostra o fluxo rotineiro pendente->impresso->entregue).
         Botão de impressora aqui = fechamento de caixa do dia selecionado. -->
      <template x-if="currentView === 'historico'">
        <div class="h-full flex flex-col">
          <div class="shrink-0">
            <h1 class="text-xl font-bold mb-4">Histórico</h1>

            <div class="flex items-center gap-2 mb-4">
              <button
                type="button"
                class="border rounded-lg p-2 text-gray-600 shrink-0"
                aria-label="Dia anterior"
                @click="shiftHistoricoDate(-1)"
                x-html="icon('chevronLeft')"
              ></button>
              <div class="relative flex-1">
                <div
                  class="border rounded-lg p-2 pr-9 w-full bg-white"
                  x-text="formatDateDisplay(historicoDate)"
                ></div>
                <input
                  type="date"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                  x-model="historicoDate"
                />
                <span
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"
                  x-html="icon('calendar')"
                ></span>
              </div>
              <button
                type="button"
                class="border rounded-lg p-2 text-gray-600 shrink-0"
                aria-label="Próximo dia"
                @click="shiftHistoricoDate(1)"
                x-html="icon('chevronRight')"
              ></button>
              <button
                type="button"
                class="border rounded-lg p-2 text-gray-600 shrink-0"
                aria-label="Fechamento de caixa"
                @click="printDailyClosing()"
                x-html="icon('printer')"
              ></button>
            </div>
          </div>

          <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar pb-4">
            <template x-if="historicoEntriesForDay().length === 0">
              <p class="text-sm text-gray-600">
                Nenhuma alteração registrada nesse dia.
              </p>
            </template>

            <div class="relative pl-6">
              <template x-if="historicoEntriesForDay().length > 0">
                <div
                  class="absolute left-[6px] top-1 bottom-1 w-0.5 bg-gray-200"
                ></div>
              </template>
              <template
                x-for="entry in historicoEntriesForDay()"
                :key="entry.id"
              >
                <div class="relative pb-5 last:pb-0">
                  <span
                    class="absolute -left-6 top-0.5 w-3.5 h-3.5 rounded-full border-2 border-white"
                    :class="auditDotClass(entry.action)"
                  ></span>
                  <p
                    class="text-xs font-semibold text-gray-500"
                    x-text="formatAuditTime(entry) + ' · ' + auditActionLabel(entry)"
                  ></p>
                  <template x-for="line in auditChangeLines(entry)" :key="line">
                    <p class="text-sm mt-0.5" x-text="line"></p>
                  </template>
                  <p
                    class="text-xs text-gray-500 mt-0.5"
                    x-text="formatPhoneMask(entry.orderSnapshot.customerPhone)"
                  ></p>
                  <template x-if="entry.orderSnapshot.address">
                    <p
                      class="text-xs text-gray-500"
                      x-text="entry.orderSnapshot.address"
                    ></p>
                  </template>
                  <template x-if="entry.action === 'delete'">
                    <p
                      class="text-xs text-gray-500"
                      x-text="orderItemLabels(entry.orderSnapshot).join(', ')"
                    ></p>
                  </template>
                  <p
                    class="text-sm font-bold mt-0.5"
                    :class="entry.action === 'delete' ? 'text-red-700' : 'text-gray-900'"
                    x-text="auditValueLine(entry)"
                  ></p>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </main>

    <!-- ===== VERSÃO DO APP (rodapé fixo, separado da navegação) =====
         Mostra quando o index.html mudou de verdade no servidor (Last-
         Modified) — não depende de bumpar número nenhum manualmente.
         "shrink-0" pra não encolher no layout flex do body, igual a nav. -->
    <template x-if="appVersionInfo">
      <p
        class="shrink-0 text-center text-[10px] text-gray-300 border-t border-gray-100 py-1.5"
        style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom))"
        x-text="appVersionInfo"
      ></p>
    </template>

    <!-- ===== NOTIFICAÇÃO TOAST (mensagens rápidas no rodapé da tela) =====
         Embaixo, e não no topo, pra não bloquear cabeçalho/navegação
         enquanto a pessoa continua mexendo na tela. -->
    <div
      x-show="toastVisible"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-2"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 translate-y-2"
      class="fixed left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-50"
      style="
        display: none;
        bottom: max(4.5rem, calc(env(safe-area-inset-bottom) + 4rem));
      "
    >
      <div
        class="bg-gray-900 text-white text-sm rounded-lg shadow-lg px-4 py-3"
        x-text="toastMessage"
      ></div>
    </div>

    <!-- ===== REGISTRO DO SERVICE WORKER (deixa o app funcionar offline/instalável) =====
         O service worker usa estratégia network-first (tenta a rede antes do
         cache), então uma mudança normal em index.html/js/*.js já chega pro
         usuário sozinha, sem precisar bumpar nada aqui. O "?v=42" abaixo e o
         CACHE_NAME em service-worker.js só precisam ser aumentados juntos
         quando o PRÓPRIO service-worker.js mudar (ex.: essa estratégia de
         cache mudar de novo) — é o que garante que o navegador não continue
         usando uma cópia antiga do arquivo do service worker em si. -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./service-worker.js?v=42")
          .then((reg) => {
            reg.update();
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") reg.update();
            });
          });

        let reloadedForUpdate = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadedForUpdate) return;
          reloadedForUpdate = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
