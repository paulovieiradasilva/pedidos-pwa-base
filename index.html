<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pedidos</title>
    <link rel="manifest" href="manifest.json" />
    <script src="vendor/tailwind.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>

  <body
    class="bg-gray-50 px-4 pb-6 max-w-md mx-auto"
    style="padding-top: max(3rem, calc(env(safe-area-inset-top) + 1.5rem))"
    x-data="pedidosApp"
    x-init="init()"
  >
    <nav class="flex border-b border-gray-200 mb-5">
      <button
        class="flex-1 pb-3 text-sm"
        :class="currentView === 'produtos' ? 'font-semibold text-gray-900 border-b-2 border-gray-900' : 'text-gray-400'"
        @click="setView('produtos')"
      >
        Produtos
      </button>
      <button
        class="flex-1 pb-3 text-sm"
        :class="currentView === 'pedidosDoDia' ? 'font-semibold text-gray-900 border-b-2 border-gray-900' : 'text-gray-400'"
        @click="setView('pedidosDoDia')"
      >
        Pedidos
      </button>
    </nav>

    <template x-if="currentView === 'produtos'">
      <div>
        <div class="flex justify-between items-baseline mb-4">
          <h1 class="text-xl font-bold">Produtos</h1>
          <button
            class="text-sm font-semibold px-3 py-2 rounded-lg"
            :class="showProductForm ? 'border border-blue-200 text-blue-700 bg-white' : 'bg-blue-600 text-white'"
            @click="showProductForm ? closeProductForm() : openNewProductForm()"
          >
            <span x-text="showProductForm ? 'Cancelar' : '+ Novo produto'"></span>
          </button>
        </div>

        <template x-if="showProductForm">
          <div class="bg-white border rounded-2xl shadow-sm p-3 mb-4">
            <h2
              class="font-medium text-sm mb-2"
              x-text="productForm.id ? 'Editar produto' : 'Novo produto'"
            ></h2>

            <label class="block mb-1 text-sm">Nome</label>
            <input
              type="text"
              class="border rounded-lg p-2 w-full mb-2"
              x-model="productForm.name"
            />

            <label class="block mb-1 text-sm">Marca (opcional)</label>
            <input
              type="text"
              class="border rounded-lg p-2 w-full mb-2"
              x-model="productForm.brand"
            />

            <label class="flex items-center gap-2 text-sm mb-2">
              <input type="checkbox" x-model="productForm.soldByWeight" />
              Vendido por peso (kg)
            </label>

            <template x-if="!productForm.soldByWeight">
              <div>
                <label class="block mb-1 text-sm">Preço</label>
                <div class="flex items-center gap-2 mb-1">
                  <span class="w-24 text-sm shrink-0">💵 Dinheiro</span>
                  <input
                    type="number"
                    step="0.01"
                    class="border rounded-lg p-2 flex-1 min-w-0"
                    :value="productForm.priceDinheiro"
                    @input="onPriceDinheiroInput($event.target.value)"
                  />
                </div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="w-24 text-sm shrink-0 text-blue-700 font-medium"
                    >Pix</span
                  >
                  <input
                    type="number"
                    step="0.01"
                    class="border rounded-lg p-2 flex-1 min-w-0"
                    :value="productForm.pricePix"
                    @input="onPricePixInput($event.target.value)"
                  />
                </div>
                <div class="flex items-center gap-2 mb-2">
                  <span class="w-24 text-sm shrink-0">💳 Cartão</span>
                  <input
                    type="number"
                    step="0.01"
                    class="border rounded-lg p-2 flex-1 min-w-0"
                    :value="productForm.priceCartao"
                    @input="onPriceCartaoInput($event.target.value)"
                  />
                </div>
              </div>
            </template>

            <template x-if="productForm.soldByWeight">
              <div class="mb-2">
                <label class="block mb-1 text-sm">Preço por kg</label>
                <input
                  type="number"
                  step="0.01"
                  class="border rounded-lg p-2 w-full"
                  x-model.number="productForm.pricePerKg"
                />
              </div>
            </template>

            <p class="text-sm text-red-600 mb-2" x-text="productFormError"></p>

            <div class="flex gap-2">
              <button
                class="bg-blue-600 text-white p-2 flex-1 rounded-lg font-semibold"
                @click="saveProductForm()"
              >
                Salvar
              </button>
              <button
                class="border border-gray-300 text-gray-700 bg-white p-2 flex-1 rounded-lg"
                @click="closeProductForm()"
              >
                Cancelar
              </button>
            </div>
          </div>
        </template>

        <input
          type="text"
          placeholder="Buscar por nome ou marca"
          class="border rounded-lg p-2 w-full mb-2"
          x-model="productSearch"
        />

        <div class="flex gap-4 mb-3 border-b border-gray-200">
          <button
            class="text-sm pb-2"
            :class="productFilter === 'active' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
            @click="productFilter = 'active'"
            x-text="'Ativos (' + activeProductCount() + ')'"
          ></button>
          <button
            class="text-sm pb-2"
            :class="productFilter === 'all' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
            @click="productFilter = 'all'"
            x-text="'Todos (' + products.length + ')'"
          ></button>
        </div>

        <template x-if="filteredProductList().length === 0">
          <p class="text-sm text-gray-600">Nenhum produto encontrado.</p>
        </template>

        <div class="flex flex-col gap-2">
          <template x-for="p in filteredProductList()" :key="p.id">
            <div
              class="bg-white border rounded-2xl shadow-sm p-3"
              :class="!p.active && 'opacity-50'"
            >
              <div class="flex justify-between items-start gap-2">
                <div>
                  <p class="text-sm font-medium" x-text="p.name"></p>
                  <template x-if="productSubtitle(p)">
                    <p
                      class="text-xs text-gray-600"
                      x-text="productSubtitle(p)"
                    ></p>
                  </template>
                </div>
                <div class="flex gap-1 shrink-0">
                  <button
                    class="bg-gray-100 rounded-lg w-8 h-8 text-sm"
                    aria-label="Editar"
                    @click="startEditProduct(p)"
                  >
                    ✎
                  </button>
                  <button
                    class="bg-gray-100 rounded-lg w-8 h-8 text-sm"
                    :aria-label="p.active ? 'Desativar' : 'Ativar'"
                    @click="toggleProductActive(p)"
                  >
                    ⏻
                  </button>
                </div>
              </div>
              <div class="flex gap-1 mt-2 flex-wrap">
                <template x-if="p.soldByWeight">
                  <span
                    class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-700"
                    x-text="'R$ ' + p.pricePerKg.toFixed(2) + '/kg'"
                  ></span>
                </template>
                <template x-if="!p.soldByWeight">
                  <span
                    class="text-xs px-2 py-1 rounded-full"
                    :class="paymentMethodPillClass('dinheiro')"
                    title="Dinheiro"
                    x-text="paymentMethodIcon('dinheiro') + ' R$ ' + p.prices.dinheiro.toFixed(2)"
                  ></span>
                </template>
                <template x-if="!p.soldByWeight">
                  <span
                    class="text-xs px-2 py-1 rounded-full"
                    :class="paymentMethodPillClass('pix')"
                    title="Pix"
                    x-text="paymentMethodIcon('pix') + ' R$ ' + p.prices.pix.toFixed(2)"
                  ></span>
                </template>
                <template x-if="!p.soldByWeight">
                  <span
                    class="text-xs px-2 py-1 rounded-full"
                    :class="paymentMethodPillClass('cartao')"
                    title="Cartão"
                    x-text="paymentMethodIcon('cartao') + ' R$ ' + p.prices.cartao.toFixed(2)"
                  ></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="currentView === 'pedidosDoDia'">
      <div>
        <div class="flex justify-between items-baseline mb-4">
          <h1 class="text-xl font-bold">Pedidos</h1>
          <button
            class="text-sm font-semibold px-3 py-2 rounded-lg"
            :class="showOrderForm ? 'border border-blue-200 text-blue-700 bg-white' : 'bg-blue-600 text-white'"
            @click="showOrderForm ? closeOrderForm() : openNewOrderForm()"
          >
            <span x-text="showOrderForm ? 'Cancelar' : '+ Novo pedido'"></span>
          </button>
        </div>

        <template x-if="showOrderForm">
          <div>
            <div class="bg-white border rounded-2xl shadow-sm p-3 mb-4">
              <label class="block mb-1 text-sm">Telefone</label>
              <div class="relative mb-1">
                <input
                  type="tel"
                  inputmode="numeric"
                  placeholder="(11) 99999-8888"
                  class="border rounded-lg p-2 w-full"
                  :value="phone"
                  @input="onPhoneInput($event.target.value)"
                  @blur="lookupCustomer()"
                />
                <template x-if="phoneSuggestions.length > 0">
                  <ul
                    class="absolute left-0 right-0 bg-white border rounded-xl shadow-md mt-1 z-10 overflow-hidden"
                  >
                    <template x-for="c in phoneSuggestions" :key="c.phone">
                      <li
                        class="p-2 text-sm border-b last:border-b-0"
                        @mousedown.prevent="selectPhoneSuggestion(c)"
                      >
                        <span
                          class="font-medium"
                          x-text="formatPhoneMask(c.phone)"
                        ></span>
                        <span
                          class="text-gray-600"
                          x-text="' · ' + c.address"
                        ></span>
                      </li>
                    </template>
                  </ul>
                </template>
              </div>
              <p
                class="text-xs text-gray-600 mb-3"
                x-text="address ? 'Endereço: ' + address : 'Cliente novo — informe o endereço abaixo'"
              ></p>
              <template x-if="!address">
                <input
                  type="text"
                  placeholder="Endereço"
                  class="border rounded-lg p-2 w-full mb-3"
                  x-model="newAddress"
                />
              </template>

              <label class="block mb-1 text-sm">Produto</label>
              <select class="border rounded-lg p-2 w-full mb-3" x-model="selectedProductId">
                <option value="" disabled>Selecione um produto</option>
                <template x-for="p in activeProducts" :key="p.id">
                  <option :value="p.id" x-text="productDisplayName(p)"></option>
                </template>
              </select>

              <template x-if="!selectedNewOrderProduct()?.soldByWeight">
                <div>
                  <label class="block mb-1 text-sm">Quantidade</label>
                  <input
                    type="number"
                    min="1"
                    class="border rounded-lg p-2 w-full mb-3"
                    x-model.number="qty"
                  />
                </div>
              </template>

              <template x-if="selectedNewOrderProduct()?.soldByWeight">
                <div>
                  <label class="block mb-1 text-sm">Gramas</label>
                  <input
                    type="number"
                    min="1"
                    placeholder="500, 1000, 1200..."
                    class="border rounded-lg p-2 w-full mb-2"
                    :value="weightGrams"
                    @input="onWeightGramsInput($event.target.value)"
                  />
                  <label class="block mb-1 text-sm"
                    >Valor (ajuste se necessário)</label
                  >
                  <input
                    type="number"
                    step="0.01"
                    class="border rounded-lg p-2 w-full mb-3"
                    :value="weightManualTotal"
                    @input="onWeightTotalInput($event.target.value)"
                  />
                </div>
              </template>

              <button
                type="button"
                class="border border-gray-300 text-gray-700 bg-white p-2 w-full rounded-lg text-sm font-medium"
                @click="addCartItem()"
              >
                + Adicionar item
              </button>
            </div>

            <div class="bg-white border rounded-2xl shadow-sm p-3 mb-4">
              <h2 class="font-medium text-sm mb-2">Itens do pedido</h2>
              <template x-if="cartItems.length === 0">
                <p class="text-sm text-gray-600">Nenhum item adicionado ainda.</p>
              </template>
              <div class="flex flex-col gap-1">
                <template x-for="(item, index) in cartItems" :key="index">
                  <div class="flex justify-between items-center text-sm border-b last:border-b-0 py-1">
                    <span
                      class="truncate"
                      x-text="(item.grams != null ? (item.grams / 1000) + 'kg' : item.qty + 'x') + ' ' + item.productName"
                    ></span>
                    <span class="flex items-center gap-2 shrink-0">
                      <template x-if="paymentMethod">
                        <span x-text="'R$ ' + cartItemLineTotal(item).toFixed(2)"></span>
                      </template>
                      <button
                        type="button"
                        class="text-gray-500 w-6 h-6"
                        aria-label="Remover item"
                        @click="removeCartItem(index)"
                      >
                        ✕
                      </button>
                    </span>
                  </div>
                </template>
              </div>
            </div>

            <div class="bg-white border rounded-2xl shadow-sm p-3 mb-4">
              <label class="block mb-1 text-sm">Pagamento</label>
              <div class="flex gap-2">
                <button
                  type="button"
                  class="flex-1 p-2 rounded-lg text-sm font-medium"
                  :class="paymentButtonClass('dinheiro')"
                  @click="paymentMethod = 'dinheiro'"
                >
                  💵 Dinheiro
                </button>
                <button
                  type="button"
                  class="flex-1 p-2 rounded-lg text-sm font-medium"
                  :class="paymentButtonClass('pix')"
                  @click="paymentMethod = 'pix'"
                >
                  Pix
                </button>
                <button
                  type="button"
                  class="flex-1 p-2 rounded-lg text-sm font-medium"
                  :class="paymentButtonClass('cartao')"
                  @click="paymentMethod = 'cartao'"
                >
                  💳 Cartão
                </button>
              </div>

              <template x-if="paymentMethod === 'dinheiro'">
                <div class="mt-3">
                  <label class="block mb-1 text-sm">Troco para quanto?</label>
                  <input
                    type="number"
                    class="border rounded-lg p-2 w-full"
                    x-model.number="changeFor"
                  />
                </div>
              </template>
            </div>

            <div class="flex justify-between items-baseline mb-3">
              <span class="text-sm text-gray-600">Total</span>
              <span
                class="text-2xl font-bold"
                x-text="'R$ ' + orderTotal().toFixed(2)"
              ></span>
            </div>

            <button
              class="bg-blue-600 text-white p-3 w-full rounded-xl font-semibold"
              @click="saveOrder()"
            >
              Gravar pedido
            </button>

            <p class="mt-4 text-sm" x-text="statusMessage"></p>
          </div>
        </template>

        <template x-if="!showOrderForm">
        <div>
        <div class="flex items-center gap-2 mb-3">
          <input
            type="date"
            class="border rounded-lg p-2 flex-1"
            x-model="selectedDate"
            @change="refreshOrders()"
          />
          <span
            class="text-sm text-gray-600 whitespace-nowrap"
            x-text="filteredOrders().length + ' pedido(s)'"
          ></span>
        </div>

        <div class="flex gap-4 mb-3 border-b border-gray-200">
          <button
            class="text-sm pb-2"
            :class="orderStatusTab === 'pendente' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
            @click="setOrderStatusTab('pendente')"
          >
            Pendente
          </button>
          <button
            class="text-sm pb-2"
            :class="orderStatusTab === 'impresso' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
            @click="setOrderStatusTab('impresso')"
          >
            Impresso
          </button>
          <button
            class="text-sm pb-2"
            :class="orderStatusTab === 'entregue' ? 'font-semibold text-blue-600 border-b-2 border-blue-600' : 'text-gray-500'"
            @click="setOrderStatusTab('entregue')"
          >
            Entregue
          </button>
        </div>

        <template
          x-if="orderStatusTab === 'pendente' && selectedOrderIds.length > 0"
        >
          <button
            class="w-full mb-3 p-2 bg-blue-600 text-white rounded-lg text-sm font-semibold"
            @click="printSelectedOrders()"
            x-text="'Imprimir selecionados (' + selectedOrderIds.length + ')'"
          ></button>
        </template>
        <template x-if="batchPrintMessage">
          <p class="text-sm text-gray-700 mb-3" x-text="batchPrintMessage"></p>
        </template>

        <div class="flex gap-2 mb-3 text-xs">
          <label
            class="flex items-center gap-1 border rounded-full px-3 py-1 cursor-pointer"
            :class="paymentFilter.dinheiro ? 'border-green-200 bg-green-50 text-green-800' : 'border-gray-300 text-gray-500'"
            title="Dinheiro"
          >
            <input
              type="checkbox"
              class="sr-only"
              x-model="paymentFilter.dinheiro"
              @change="onFilterChange()"
            />
            <span aria-hidden="true">💵</span>
          </label>
          <label
            class="flex items-center gap-1 border rounded-full px-3 py-1 cursor-pointer"
            :class="paymentFilter.pix ? 'border-blue-200 bg-blue-50 text-blue-800 font-medium' : 'border-gray-300 text-gray-500'"
            title="Pix"
          >
            <input
              type="checkbox"
              class="sr-only"
              x-model="paymentFilter.pix"
              @change="onFilterChange()"
            />
            <span>Pix</span>
          </label>
          <label
            class="flex items-center gap-1 border rounded-full px-3 py-1 cursor-pointer"
            :class="paymentFilter.cartao ? 'border-purple-200 bg-purple-50 text-purple-800' : 'border-gray-300 text-gray-500'"
            title="Cartão"
          >
            <input
              type="checkbox"
              class="sr-only"
              x-model="paymentFilter.cartao"
              @change="onFilterChange()"
            />
            <span aria-hidden="true">💳</span>
          </label>
        </div>

        <template x-if="todayOrders.length === 0">
          <p class="text-sm text-gray-600">Nenhum pedido nesse dia.</p>
        </template>
        <template
          x-if="todayOrders.length > 0 && filteredOrders().length === 0"
        >
          <p class="text-sm text-gray-600">
            Nenhum pedido nessa aba com esse filtro.
          </p>
        </template>

        <div class="flex flex-col gap-2">
          <template x-for="o in visibleOrders()" :key="o.id">
            <div
              class="bg-white border rounded-2xl shadow-sm p-2 border-l-4"
              :class="paymentMethodAccentClass(o.paymentMethod)"
            >
              <div class="flex justify-between items-baseline gap-2">
                <span class="flex items-center gap-2 min-w-0">
                  <template x-if="orderStatusTab === 'pendente'">
                    <input
                      type="checkbox"
                      :checked="selectedOrderIds.includes(o.id)"
                      @change="toggleOrderSelected(o.id)"
                    />
                  </template>
                  <span
                    class="text-sm font-medium truncate"
                    x-text="new Date(o.createdAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' · ' + formatPhoneMask(o.customerPhone)"
                  ></span>
                </span>
                <span
                  class="text-base font-bold shrink-0"
                  x-text="'R$ ' + o.total.toFixed(2)"
                ></span>
              </div>
              <template x-if="o.address">
                <p
                  class="text-xs text-gray-600 truncate"
                  x-text="o.address"
                ></p>
              </template>
              <div class="flex justify-between items-baseline mt-1">
                <span
                  class="text-xs text-gray-600"
                  x-text="orderSummary(o)"
                ></span>
                <span
                  class="text-xs font-medium"
                  :class="paymentMethodTextClass(o.paymentMethod)"
                  :title="paymentMethodLabel(o.paymentMethod)"
                  x-text="paymentMethodIcon(o.paymentMethod)"
                ></span>
              </div>
              <template x-if="orderStatusTab === 'impresso'">
                <button
                  class="w-full mt-2 p-1 border border-gray-300 text-gray-700 bg-white rounded-lg text-xs"
                  @click="markOrderDelivered(o)"
                >
                  Marcar entregue
                </button>
              </template>
            </div>
          </template>
        </div>

        <button
          x-show="visibleOrderCount < filteredOrders().length"
          class="mt-3 w-full p-2 border border-gray-300 text-gray-700 bg-white rounded-lg text-sm"
          @click="showMoreOrders()"
        >
          Mostrar mais
        </button>
        </div>
        </template>
      </div>
    </template>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js");
      }
    </script>
  </body>
</html>
