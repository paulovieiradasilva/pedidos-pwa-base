<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos</title>
    <link rel="manifest" href="manifest.json" />
    <script src="vendor/tailwind.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>

  <body
    class="bg-gray-50 p-4 max-w-md mx-auto"
    x-data="pedidosApp"
    x-init="init()"
  >
    <nav class="flex gap-2 mb-4">
      <button
        class="flex-1 p-2 rounded text-sm"
        :class="currentView === 'novoPedido' ? 'bg-blue-600 text-white' : 'bg-gray-200'"
        @click="setView('novoPedido')"
      >
        Novo Pedido
      </button>
      <button
        class="flex-1 p-2 rounded text-sm"
        :class="currentView === 'produtos' ? 'bg-blue-600 text-white' : 'bg-gray-200'"
        @click="setView('produtos')"
      >
        Produtos
      </button>
      <button
        class="flex-1 p-2 rounded text-sm"
        :class="currentView === 'pedidosDoDia' ? 'bg-blue-600 text-white' : 'bg-gray-200'"
        @click="setView('pedidosDoDia')"
      >
        Pedidos do Dia
      </button>
    </nav>

    <template x-if="currentView === 'novoPedido'">
      <div>
        <h1 class="text-xl font-bold mb-4">Novo Pedido</h1>

        <label class="block mb-2">Telefone</label>
        <input
          type="tel"
          class="border p-2 w-full mb-1"
          x-model="phone"
          @blur="lookupCustomer()"
        />
        <p
          class="text-sm text-gray-600 mb-3"
          x-text="address ? 'Endereço: ' + address : 'Cliente novo — informe o endereço abaixo'"
        ></p>
        <template x-if="!address">
          <input
            type="text"
            placeholder="Endereço"
            class="border p-2 w-full mb-3"
            x-model="newAddress"
          />
        </template>

        <label class="block mb-2">Produto</label>
        <select class="border p-2 w-full mb-3" x-model="selectedProductId">
          <option value="" disabled>Selecione um produto</option>
          <template x-for="p in activeProducts" :key="p.id">
            <option
              :value="p.id"
              x-text="p.name + ' ' + p.brand"
            ></option>
          </template>
        </select>

        <label class="block mb-2">Quantidade</label>
        <input
          type="number"
          min="1"
          class="border p-2 w-full mb-3"
          x-model.number="qty"
        />

        <label class="block mb-2">Pagamento</label>
        <select class="border p-2 w-full mb-3" x-model="paymentMethod">
          <option value="" disabled>Selecione a forma de pagamento</option>
          <option value="dinheiro">Dinheiro</option>
          <option value="pix">Pix</option>
          <option value="cartao">Cartão</option>
        </select>

        <template x-if="paymentMethod === 'dinheiro'">
          <div>
            <label class="block mb-2">Troco para quanto?</label>
            <input
              type="number"
              class="border p-2 w-full mb-3"
              x-model.number="changeFor"
            />
          </div>
        </template>

        <p class="text-lg font-bold mb-2" x-text="'Total: R$ ' + orderTotal().toFixed(2)"></p>

        <button
          class="bg-blue-600 text-white p-3 w-full rounded"
          @click="confirmOrder()"
        >
          Confirmar e Imprimir
        </button>

        <p class="mt-3 text-sm" x-text="statusMessage"></p>
      </div>
    </template>

    <template x-if="currentView === 'produtos'">
      <div>
        <h1 class="text-xl font-bold mb-4">Produtos</h1>

        <div class="border rounded p-3 mb-4 bg-white">
          <h2 class="font-bold mb-2" x-text="productForm.id ? 'Editar produto' : 'Novo produto'"></h2>

          <label class="block mb-1 text-sm">Nome</label>
          <input type="text" class="border p-2 w-full mb-2" x-model="productForm.name" />

          <label class="block mb-1 text-sm">Marca</label>
          <input type="text" class="border p-2 w-full mb-2" x-model="productForm.brand" />

          <label class="block mb-1 text-sm">Preço Dinheiro</label>
          <input type="number" step="0.01" class="border p-2 w-full mb-2" x-model.number="productForm.priceDinheiro" />

          <label class="block mb-1 text-sm">Preço Pix</label>
          <input type="number" step="0.01" class="border p-2 w-full mb-2" x-model.number="productForm.pricePix" />

          <label class="block mb-1 text-sm">Preço Cartão</label>
          <input type="number" step="0.01" class="border p-2 w-full mb-2" x-model.number="productForm.priceCartao" />

          <p class="text-sm text-red-600 mb-2" x-text="productFormError"></p>

          <div class="flex gap-2">
            <button class="bg-blue-600 text-white p-2 flex-1 rounded" @click="saveProductForm()">Salvar</button>
            <button class="bg-gray-200 p-2 flex-1 rounded" @click="startCreateProduct()">Cancelar</button>
          </div>
        </div>

        <template x-for="p in products" :key="p.id">
          <div class="border-b py-2 text-sm flex justify-between items-start gap-2" :class="!p.active && 'opacity-50'">
            <div>
              <p class="font-bold" x-text="p.name + ' ' + p.brand + (p.active ? '' : ' (inativo)')"></p>
              <p x-text="'Dinheiro: R$ ' + p.prices.dinheiro.toFixed(2) + ' | Pix: R$ ' + p.prices.pix.toFixed(2) + ' | Cartão: R$ ' + p.prices.cartao.toFixed(2)"></p>
            </div>
            <div class="flex flex-col gap-1 shrink-0">
              <button class="bg-gray-200 px-2 py-1 rounded text-xs" @click="startEditProduct(p)">Editar</button>
              <button class="bg-gray-200 px-2 py-1 rounded text-xs" @click="toggleProductActive(p)" x-text="p.active ? 'Desativar' : 'Ativar'"></button>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="currentView === 'pedidosDoDia'">
      <div>
        <h1 class="text-xl font-bold mb-4">Pedidos de Hoje</h1>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left border-b">
                <th class="py-1">Hora</th>
                <th class="py-1">Telefone</th>
                <th class="py-1">Itens</th>
                <th class="py-1">Pagamento</th>
                <th class="py-1">Total</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="o in visibleOrders()" :key="o.id">
                <tr class="border-b">
                  <td class="py-1" x-text="new Date(o.createdAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })"></td>
                  <td class="py-1" x-text="o.customerPhone"></td>
                  <td class="py-1" x-text="o.items.length + ' item(s)'"></td>
                  <td class="py-1" x-text="o.paymentMethod"></td>
                  <td class="py-1" x-text="'R$ ' + o.total.toFixed(2)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <button
          x-show="visibleOrderCount < todayOrders.length"
          class="mt-3 w-full p-2 bg-gray-200 rounded text-sm"
          @click="showMoreOrders()"
        >
          Mostrar mais
        </button>
      </div>
    </template>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js");
      }
    </script>
  </body>
</html>
